<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E9">
<meta name="description" content="暮らしとお金の「ちょっと面倒な計算」を、スマホでさっと。">
<title>そらのツール箱</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F6F1E9;--card:#FFFDF9;--ink:#2B2A28;--sub:#77726A;--line:#E6DED2;--accent:#2F6F5E;--accent-soft:#E3EFEA;--warn:#C2523C}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
.brand{padding:28px 0 8px}
.brand .mark{width:44px;height:44px;border-radius:12px;display:block;margin-bottom:12px}
h1{font-size:24px;margin:0;letter-spacing:.04em}
.tag{color:var(--sub);font-size:14px;margin:6px 0 0;line-height:1.6}
.unlock{display:flex;gap:8px;margin:18px 0 6px}
.unlock input{flex:1;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;letter-spacing:.08em;text-transform:uppercase}
.unlock button{font:inherit;font-size:15px;font-weight:600;border:0;border-radius:12px;padding:0 18px;background:var(--accent);color:#fff}
.hint{font-size:12px;color:var(--sub);min-height:18px}
.hint.ok{color:var(--accent)}.hint.ng{color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;display:grid;grid-template-columns:52px 1fr;gap:14px}
.card.soon{opacity:.6}
.ico{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:#EFE8DC}
.card h2{font-size:16px;margin:2px 0 4px}
.card p{font-size:13px;color:var(--sub);margin:0 0 10px;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:11px;padding:3px 8px;border-radius:999px;background:#F1EBE0;color:var(--sub)}
.chip.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.acts{display:flex;gap:8px}
.acts a,.acts button{font:inherit;font-size:14px;font-weight:600;text-decoration:none;border-radius:12px;padding:10px 14px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.acts .primary{background:var(--accent);border-color:var(--accent);color:#fff}
.how{font-size:12px;color:var(--sub);line-height:1.8;margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.how b{color:var(--ink)}
.how a{color:var(--accent)}
.install{display:none;margin-top:8px;font-size:12px;color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img class="mark" src="icon-192.png" alt="">
    <h1>そらのツール箱</h1>
    <p class="tag">暮らしとお金の「ちょっと面倒な計算」を、スマホでさっと。</p>
  </div>

  <form class="unlock" id="unlockForm" autocomplete="off">
    <input id="code" placeholder="購入コードを入力" aria-label="購入コード" autocapitalize="characters" spellcheck="false">
    <button type="submit">開く</button>
  </form>
  <div class="hint" id="hint">noteで購入したコードを入れると、そのツールが使えるようになります。</div>

  <div id="list"></div>

  <div class="how">
    <b>使い方</b><br>
    1. noteで使いたいツールの記事を購入し、記事内の「購入コード」を確認<br>
    2. 上の欄にコードを入れて「開く」<br>
    3. 一度開いたツールは、この端末ではコードなしで使えます（ホーム画面に追加すると便利です）<br><br>
    <b>データについて</b><br>
    入力した内容はこの端末の中だけに保存され、どこにも送信されません。<br><br>
    運営：<a href="https://note.com/tmsora8496" target="_blank" rel="noopener">そら（note）</a>
  </div>
</div>

<script src="crypto.js?v=mwoht36v"></script>
<script>
const CATALOG = [{"id":"nenshu-kabe","status":"live","icon":"🧱","title":"年収の壁シミュレーター 2026","desc":"時給と週の労働時間から、本人と世帯の手取りを計算。扶養内の最大・働き損ゾーン・壁を越えて元が取れる時間がひと目でわかります。","tags":["パート・共働き","2026年10月の社保改正対応"],"price":"500円","note":"https://note.com/tmsora8496"},{"id":"nencho","status":"live","icon":"🧾","title":"年末調整かんたんナビ 2026","desc":"保険料控除申告書・配偶者控除等申告書の「どの欄に何円書くか」を自動計算。競艇・競馬の払戻金があるときの確定申告の要否と増える税額もわかります。","tags":["会社員","令和8年分対応","競艇・競馬の払戻金"],"price":"500円","note":"https://note.com/tmsora8496"},{"id":"nisa-waku","status":"soon","icon":"📈","title":"新NISA 枠管理（家族4人分）","desc":"家族それぞれの「今年あといくら買えるか」と、売却後に翌年戻る生涯枠を自動で計算。こどもNISA（2027年〜）にも対応予定。","tags":["資産管理"],"price":"500円","note":"https://note.com/tmsora8496"}];
const SITE = {"salt":"b8j/k89hxRTcldfUHYJOqA==","iter":200000};
const $ = id => document.getElementById(id);

function render() {
  $("list").innerHTML = CATALOG.map(t => {
    const owned = t.status === "live" && SoraLock.hasKey(t.id);
    const chips = (t.tags || []).map(c => `<span class="chip">${c}</span>`).join("") +
      (t.status !== "live" ? `<span class="chip">準備中</span>` : owned ? `<span class="chip on">使えます</span>` : `<span class="chip">${t.price}</span>`);
    let acts = "";
    if (t.status === "live") {
      acts = owned ? `<a class="primary" href="tool.html?id=${t.id}">開く</a>`
        : `<a class="primary" href="${t.note}" target="_blank" rel="noopener">noteで購入</a><button type="button" data-focus="1">コードを入れる</button>`;
    }
    return `<div class="card ${t.status !== "live" ? "soon" : ""}" id="tool-${t.id}"><div class="ico">${t.icon}</div><div>
      <h2>${t.title}</h2><p>${t.desc}</p><div class="chips">${chips}</div><div class="acts">${acts}</div></div></div>`;
  }).join("");
  document.querySelectorAll("[data-focus]").forEach(b => b.addEventListener("click", () => { $("code").focus(); window.scrollTo({top: 0, behavior: "smooth"}); }));
}

let files = null;
async function loadFiles() {
  if (files) return files;
  files = {};
  for (const t of CATALOG.filter(t => t.status === "live")) {
    files[t.id] = await (await fetch("tools/" + t.id + ".json?v=mwoht36v")).json();
  }
  return files;
}

$("unlockForm").addEventListener("submit", async e => {
  e.preventDefault();
  const code = $("code").value;
  const hint = $("hint");
  if (SoraLock.normalize(code).length < 6) { hint.textContent = "コードをもう一度確認してください。"; hint.className = "hint ng"; return; }
  hint.textContent = "確認しています…"; hint.className = "hint";
  try {
    const opened = await SoraLock.unlockWithCode(code, SITE, await loadFiles());
    if (opened.length) {
      const names = opened.map(id => (CATALOG.find(t => t.id === id) || {}).title).join("・");
      hint.textContent = "開きました：" + names; hint.className = "hint ok"; $("code").value = "";
      render();
      if (opened.length === 1) setTimeout(() => location.href = "tool.html?id=" + opened[0], 600);
    } else { hint.textContent = "このコードでは開けませんでした。記事内の最新のコードを確認してください。"; hint.className = "hint ng"; }
  } catch (err) { hint.textContent = "読み込みに失敗しました。通信状況を確認してください。"; hint.className = "hint ng"; }
});

const want = new URLSearchParams(location.search).get("unlock");
render();
if (want) { $("hint").textContent = "このツールを使うには購入コードが必要です。"; const el = document.getElementById("tool-" + want); if (el) el.scrollIntoView(); }
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
