<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F7">
<title>読み込み中…｜そらのツール箱</title>
<link rel="icon" href="icon-192.png">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F2F4F7;color:#5D6878;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px}
</style>
</head>
<body>
<p id="msg">ツールを読み込んでいます…</p>
<script src="crypto.js?v=mwuszluw"></script>
<script>
(async function () {
  const id = new URLSearchParams(location.search).get("id") || "";
  if (!/^[a-z0-9-]+$/.test(id)) { location.replace("./index.html"); return; }
  // 家計簿は単体のアプリとして開く
  if (id === "kakeibo") { location.replace("./kakeibo.html"); return; }
  if (!SoraLock.hasKey(id)) { location.replace("./index.html?unlock=" + id); return; }
  try {
    const file = await (await fetch("tools/" + id + ".json?v=mwuszluw")).json();
    const html = await SoraLock.decryptTool(id, file);
    document.open(); document.write(html); document.close();
  } catch (e) {
    document.getElementById("msg").innerHTML = '読み込めませんでした。<a href="./index.html?unlock=' + id + '">コードを入れ直す</a>';
  }
})();
</script>
</body>
</html>
